name: Release

# Fires when a v* tag is pushed. Builds the wheel and sdist, checks they are
# well-formed, and attaches them to a GitHub Release.
#
# Deliberately does not publish to PyPI. Publishing is irreversible — a version
# number on PyPI can never be reused, even after a yank — so it stays a
# deliberate act rather than a side effect of pushing a tag. The job below is
# also exactly what a PyPI publish would need, so adding it later is one step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the packaged version
        run: |
          python - <<'PY'
          import os, re, pathlib, sys
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if not tag.startswith("v"):
              sys.exit(0)  # manual dispatch, nothing to compare
          pyproject = pathlib.Path("pyproject.toml").read_text()
          version = re.search(r'^version = "(.+?)"', pyproject, re.M).group(1)
          if tag[1:] != version:
              sys.exit(f"tag {tag} does not match pyproject version {version}")
          print(f"tag {tag} matches pyproject version {version}")
          PY

      - name: Run the test suite before releasing anything
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check src tests scripts eval
          pytest

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
