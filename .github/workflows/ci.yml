name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint
        run: ruff check src tests scripts eval

      - name: Format check
        run: ruff format --check src tests scripts eval

      - name: Test
        # No API keys in CI on purpose: every test mocks HTTP, so the suite
        # never spends free-tier quota and never flakes on a rate limit.
        run: pytest
